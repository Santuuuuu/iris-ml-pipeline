name: CI Development Branch

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests
      id: run-tests
      run: |
        python -m pytest tests/ -v
        echo "result=success" >> $GITHUB_OUTPUT
      continue-on-error: true
    
    - name: Install GitHub CLI
      if: always()
      run: |
        type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
        sudo apt update
        sudo apt install gh -y
    
    - name: Post CI Report
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TEST_RESULT: ${{ steps.run-tests.outputs.result }}
      run: |
        if [ "$TEST_RESULT" = "success" ]; then
          gh pr comment ${{ github.event.pull_request.number }} --body "## ✅ CI Test Report - Success

**PR:** ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}
**Status:** All tests passed!

### Test Summary
- ✅ All unit tests executed successfully
- ✅ Data validation completed
- ✅ Model tests passed
- ✅ Ready for merge

### Quality Gates
- **Framework:** pytest
- **CI:** GitHub Actions
- **Branch:** dev → main

🚀 **Ready for review and merge!**

*Automated report from GitHub Actions CI*"
        else
          gh pr comment ${{ github.event.pull_request.number }} --body "## ❌ CI Test Report - Failed

**PR:** ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}
**Status:** Some tests failed

### Next Steps
- Review test failures in Actions tab
- Fix identified issues
- Re-run CI pipeline

🔧 **Needs attention before merge**

*Automated report from GitHub Actions CI*"
        fi
