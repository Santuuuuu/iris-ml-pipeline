name: CI Development Branch

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests
      run: |
        python -m pytest tests/ -v

  cml-report:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v3
      
    - name: CML Report
      uses: iterative/cml@v0.15.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🧪 Development Test Report" > report.md
          echo "**Status:** ✅ All tests passed!" >> report.md
          echo "**Branch:** ${{ github.ref }}" >> report.md
          echo "" >> report.md
          echo "### Summary" >> report.md
          echo "- ✅ Unit tests passed" >> report.md
          echo "- ✅ Data validation working" >> report.md
          echo "- ✅ Ready for merge" >> report.md
        file: report.md
