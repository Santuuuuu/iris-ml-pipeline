name: CI Development Branch

on:
  pull_request:
    branches: [ main ]

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests
      id: tests
      run: |
        python -m pytest tests/ -v
        echo "TESTS_PASSED=true" >> $GITHUB_OUTPUT
    
    - name: Create test report
      uses: actions/github-script@v6
      env:
        TESTS_PASSED: ${{ steps.tests.outputs.TESTS_PASSED }}
      with:
        script: |
          try {
            const testsPassed = process.env.TESTS_PASSED === 'true';
            
            const report = `
## 📊 Automated Test Report

**PR:** ${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}
**Status:** ${testsPassed ? '✅ PASSED' : '❌ FAILED'}

### Test Summary
- ${testsPassed ? '✅' : '❌'} All unit tests ${testsPassed ? 'passed' : 'failed'}
- ${testsPassed ? '✅' : '❌'} Data validation tests completed
- ${testsPassed ? '✅' : '❌'} Model evaluation tests finished

### Quality Check
- **Branch:** dev → main
- **CI:** GitHub Actions
- **Framework:** pytest
- **Reporting:** Automated

### Recommendation
${testsPassed ? '**🟢 READY FOR MERGE** - All checks passed' : '**🔴 NEEDS FIXING** - Tests failed'}

---
*Generated by GitHub Actions CI*
            `;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
            
            console.log('✅ Test report posted successfully');
          } catch (error) {
            console.log('❌ Failed to post report:', error);
            
            // Fallback simple comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 🤖 CI Report\nTests completed. Report generation had issues but CI finished.'
            });
          }
