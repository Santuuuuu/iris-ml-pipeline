name: CI Development Branch

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.9"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas scikit-learn pytest
        
    - name: Create test data
      run: |
        mkdir -p data
        python -c "
        import pandas as pd
        from sklearn.datasets import load_iris
        iris = load_iris()
        df = pd.DataFrame(iris.data, columns=iris.feature_names)
        df['species'] = iris.target
        df.columns = ['sepal_length', 'sepal_width', 'petal_length', 'petal_width', 'species']
        df.to_csv('data/iris.csv', index=False)
        print('Test data created')
        "
    
    - name: Run basic tests
      run: |
        python -m pytest tests/test_always_passes.py -v
    
    - name: Run data validation test
      run: |
        python -c "
        import pandas as pd
        df = pd.read_csv('data/iris.csv')
        print(f'Data loaded: {len(df)} rows, {len(df.columns)} columns')
        print('Columns:', list(df.columns))
        assert len(df) == 150, 'Should have 150 samples'
        assert 'species' in df.columns, 'Should have species column'
        print('✅ Data validation passed')
        "
