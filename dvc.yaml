stages:
  download_data:
    cmd: python src/download_data.py
    deps:
      - src/download_data.py
    outs:
      - data/iris.csv

  train_model:
    cmd: python src/train.py
    deps:
      - data/iris.csv
      - src/train.py
    params:
      - train.test_size
      - train.random_state
    outs:
      - models/iris_model.joblib
    metrics:
      - metrics.json:
          cache: false

params:
  train:
    test_size: 0.2
    random_state: 42
